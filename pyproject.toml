[build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "funpoetry"
version = "1.0.7"
description = ""
authors = [ "farfun <1007530194@qq.com>",]
readme = "README.md"
include = [ "src/funpoetry/py.typed",]
[[tool.poetry.packages]]
from = "src"
include = "*"

[tool.poetry.dependencies]
python = "^3.10"
toml = "^0.10.2"
poetry = "^2.3.4"
cryptography = ">=49.0.0"

[tool.poetry.scripts]
funpoetry = "funpoetry.command:funpoetry"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
