[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funpoetry"
version = "1.0.8"
description = "同步更新 PEP 621、Poetry 或版本文件中版本号的命令行工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "farfun", email = "1007530194@qq.com" }]
dependencies = ["toml>=0.10.2,<0.11.0"]

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funpoetry"
Releases = "https://github.com/farfarfun/funpoetry/releases"

[project.scripts]
funpoetry = "funpoetry.command:funpoetry"

[dependency-groups]
dev = ["funbuild>=1.6.66", "pytest>=9.0.3,<10.0.0", "ruff>=0.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/funpoetry"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
